<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocuSync AI - review</title>
<style>
:root{--bg:#0a1020;--rail:#0c1426;--panel:#0f1a30;--panel2:#13203b;--line:#1f2f4d;--ink:#dbe5f7;--mute:#7f93b6;--acc:#4f8cff;--ok:#2fc58a;--warn:#f0b24a;--bad:#ff6b6b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:56px 1fr;grid-template-rows:56px 1fr;height:100%}
.rail{grid-row:1/3;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px}
.rail button{width:38px;height:38px;border:0;border-radius:9px;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.rail button.on,.rail button:hover{background:var(--panel2);color:var(--acc)}
.rail svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.top{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--rail)}
.logo{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}.logo i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#4f8cff,#2fc58a);display:inline-block}
.top .sp{flex:1}.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;color:var(--mute);display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.bad{background:var(--bad)}
select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:240px}
main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px}
.pane{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--rail);align-items:center}
.tab{white-space:nowrap;padding:12px 10px;color:var(--mute);cursor:pointer;border:0;background:none;border-bottom:2px solid transparent}
.tab.on{color:var(--acc);border-color:var(--acc)}
.tools{margin-left:auto;display:flex;gap:8px;padding:6px 0}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--acc)}.btn.pri{border-color:#2d5bd0;color:#9bbcff}.btn.warn{border-color:#8a6a2a;color:var(--warn)}
.viewer{flex:1;overflow:auto;padding:18px;background:#070c18}
.page{position:relative;margin:0 auto 18px;max-width:860px;background:#fff;border-radius:3px;box-shadow:0 8px 30px #0008}
.page img{display:block;width:100%;height:auto}.page svg{position:absolute;inset:0;width:100%;height:100%}
.pl{max-width:860px;margin:0 auto 6px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--mute)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.textview{max-width:860px;margin:0 auto}.tb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px}
.tb small{color:var(--mute);font-family:var(--mono);font-size:11px;margin-right:8px}
.side{min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.sbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
.sbody{flex:1;overflow:auto;padding:12px 14px}
.sec{margin:14px 0 8px;color:var(--mute);font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.fld{margin-bottom:11px}.fld label{display:flex;gap:7px;align-items:center;color:var(--mute);font-size:12px;margin-bottom:4px}
.val{background:#0a1326;border:1px solid var(--line);border-radius:9px;padding:9px 11px;word-break:break-word;max-height:150px;overflow:auto;white-space:pre-wrap}
.val.low{border-color:#6b2c2c;background:#170f16}
.b{font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600}.b.g{background:#12372b;color:var(--ok)}.b.a{background:#3a2e12;color:var(--warn)}.b.r{background:#3b1717;color:var(--bad)}
pre.xml{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all}.xml .t{color:#7fb4ff}.xml .a{color:#f0b24a}.xml .v{color:#7de0b0}
.card{border:1px solid var(--line);background:#0b1429;border-radius:10px;padding:10px 12px;margin-bottom:9px}
.card .h{display:flex;gap:8px;align-items:center;margin-bottom:6px;color:var(--mute);font-size:12px}
.del{background:#3b1717;color:#ffb1b1;border-radius:4px;padding:0 3px;text-decoration:line-through}.ins{background:#12372b;color:#8ff0c2;border-radius:4px;padding:0 3px}
.acts{display:flex;gap:6px;margin-top:8px}.acts .btn{padding:3px 9px;font-size:12px}.acts .on{background:#17325a;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi b{display:block;font-size:24px;margin-top:4px}
table{border-collapse:collapse;width:100%}td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:500}tr.c{cursor:pointer}tr.c:hover{background:var(--panel2)}
.dash{overflow:auto;padding:0 18px 24px;grid-column:1/3}.empty{color:var(--mute);padding:40px;text-align:center}
</style></head><body>
<div class="app">
<nav class="rail">
 <button id="nv-review" class="on" title="Review"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg></button>
 <button id="nv-dash" title="Dashboard"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="4" rx="1"/><rect x="13" y="10" width="7" height="10" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/></svg></button>
</nav>
<header class="top"><div class="logo"><i></i>DocuSync&nbsp;AI</div><select id="docsel"></select><div class="sp"></div><div class="chip" id="runchip"><span class="dot"></span><span>no run loaded</span></div></header>
<main id="main">
 <section class="pane" id="viewpane">
  <div class="tabs" id="vtabs"><button class="tab" data-t="zoning">Zoning</button><button class="tab" data-t="order">Reading Order</button><button class="tab on" data-t="pdf">Source PDF</button><button class="tab" data-t="text">Text</button>
   <div class="tools"><button class="btn" id="rot" title="Rotate source view">Rotate</button></div></div>
  <div class="legend" id="legend" hidden></div>
  <div class="viewer" id="viewer"><div class="empty">Select a document</div></div>
 </section>
 <aside class="side">
  <div class="tabs" id="stabs"><button class="tab on" data-t="meta">Metadata</button><button class="tab" data-t="xml">XML</button><button class="tab" data-t="deck">Changes</button>
   <div class="tools"><button class="btn pri" id="dlxml">XML</button><button class="btn warn" id="reproc">Re-process</button></div></div>
  <div class="sbar" id="sbar"></div>
  <div class="sbody" id="sbody"></div>
 </aside>
</main>
<section class="dash" id="dash" hidden></section>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL={h:"#a77bff",p:"#4f8cff",li:"#2fc58a",ul:"#2fc58a",ol:"#2fc58a",table:"#f0883e",figure:"#ff6fb5",header:"#8a97b1",footer:"#8a97b1",aside:"#e6c84a",hr:"#667"};
const col=t=>COL[t]||COL[t[0]]||"#4f8cff";
const S={docs:[],id:null,data:null,vtab:"pdf",stab:"meta",rot:0,filter:"all",xml:"",changes:[],cfilter:"all"};
const badge=c=>{const v=Math.round(c);return `<span class="b ${v>=97?"g":v>=80?"a":"r"}">${v}%</span>`};
async function J(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json()}
async function init(){
 const sm=await J("/api/summary");S.sum=sm;S.docs=sm.docs;
 $("#docsel").innerHTML=S.docs.map(d=>`<option value="${esc(d.id)}">${esc(d.file||d.id)}  -  ${d.pages} pp${d.ocr_pages?`, ${d.ocr_pages} OCR`:""}</option>`).join("");
 $("#runchip").innerHTML=`<span class="dot ${sm.failed?"bad":""}"></span><span>${sm.succeeded??"?"}/${sm.documents} documents OK &middot; ${sm.pages} pages &middot; ${sm.wall_seconds}s</span>`;
 if(S.docs.length)open(S.docs[0].id);else $("#viewer").innerHTML='<div class="empty">No processed documents found in the run directory.</div>';
 dash();
}
async function open(id){S.id=id;$("#docsel").value=id;S.data=await J("/api/doc/"+encodeURIComponent(id));
 try{S.xml=await (await fetch(`/api/doc/${encodeURIComponent(id)}/xml`)).text()}catch(e){S.xml=""}
 try{S.changes=await J(`/api/doc/${encodeURIComponent(id)}/changes`)}catch(e){S.changes=[]}
 viewer();side()}
function viewer(){
 const d=S.data;if(!d)return;const lg=$("#legend");lg.hidden=!(S.vtab==="zoning"||S.vtab==="order");
 lg.innerHTML=S.vtab==="zoning"?Object.entries({heading:"h",paragraph:"p",list:"ul",table:"table",figure:"figure","header/footer":"header",footnote:"aside"}).map(([k,t])=>`<span><b style="background:${col(t)}"></b>${k}</span>`).join(""):"Numbers show the reading order within each page";
 $("#rot").disabled=S.vtab!=="pdf";
 if(S.vtab==="text"){$("#viewer").innerHTML=`<div class="textview">`+d.pages.map(p=>`<div class="pl"><span>Page ${p.n}</span><span>${p.source.toUpperCase()}</span></div>`+p.blocks.map(b=>`<div class="tb"><small>${b.tag}${b.kind?" / "+esc(b.kind):""}</small>${esc(b.text)||"<i style='color:var(--mute)'>(no text)</i>"}</div>`).join("")).join("")+`</div>`;return}
 $("#viewer").innerHTML=d.pages.map(p=>{
  let ov="";
  if(S.vtab==="zoning"||S.vtab==="order"){ov=`<svg viewBox="0 0 ${p.w} ${p.h}" preserveAspectRatio="none">`+p.blocks.filter(b=>b.bbox).map((b,k)=>{const [x0,y0,x1,y1]=b.bbox,c=col(b.tag);
   return S.vtab==="zoning"?`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-width="1.4"><title>${esc(b.tag+(b.kind?" / "+b.kind:"")+" - "+b.text.slice(0,80))}</title></rect>`
   :`<circle cx="${x0}" cy="${y0+8}" r="9" fill="${c}"/><text x="${x0}" y="${y0+11.5}" font-size="10" text-anchor="middle" fill="#fff" font-family="sans-serif">${k+1}</text>`}).join("")+`</svg>`}
  const src=`/api/doc/${encodeURIComponent(d.id)}/page/${p.n}.png?dpi=110&rot=${S.vtab==="pdf"?S.rot:0}`;
  return `<div class="pl"><span>Page ${p.n}</span><span>${p.source==="ocr"?"OCR":"native text"} &middot; ${badge((p.diag.confidence||0)*100)}</span></div><div class="page"><img loading="lazy" src="${src}" alt="page ${p.n}">${ov}</div>`}).join("")}
function side(){
 const d=S.data;if(!d)return;const sb=$("#sbar"),bd=$("#sbody");
 $("#dlxml").style.display=S.stab==="xml"||S.stab==="meta"?"":"none";
 if(S.stab==="xml"){sb.innerHTML=`<span style="color:var(--mute)">${S.xml.length.toLocaleString()} characters</span>`;
  bd.innerHTML=`<pre class="xml">`+esc(S.xml).replace(/(&lt;\/?)([\w:-]+)/g,'$1<span class="t">$2</span>').replace(/ ([\w:-]+)=(&quot;.*?&quot;)/g,' <span class="a">$1</span>=<span class="v">$2</span>')+`</pre>`;return}
 if(S.stab==="deck"){const cs=S.changes.filter(c=>S.cfilter==="all"||c.action===S.cfilter);
  sb.innerHTML=`<select id="cf" style="min-width:0">${["all","applied","review"].map(v=>`<option ${S.cfilter===v?"selected":""} value="${v}">${v}</option>`).join("")}</select><span style="color:var(--mute)">${cs.length} of ${S.changes.length} changes</span><span style="margin-left:auto"><a class="btn" href="/api/doc/${encodeURIComponent(d.id)}/deck">Deck</a></span>`;
  bd.innerHTML=cs.length?cs.slice(0,400).map(c=>`<div class="card"><div class="h"><b>Slide ${c.original_location.slide}</b><span>${esc(c.change_type.replace(/_/g," "))}</span>${badge(c.confidence*100)}<span style="margin-left:auto">${c.action}</span></div>
   ${c.old_content||c.new_content?`<div>${c.old_content?`<span class="del">${esc(c.old_content.slice(0,160))}</span>`:""} ${c.new_content?`<span class="ins">${esc(c.new_content.slice(0,200))}</span>`:""}</div>`:""}
   <div style="color:var(--mute);font-size:12px;margin-top:5px">${esc(c.reason)}</div>
   <div class="acts"><button class="btn ${c.decision==="accepted"?"on":""}" data-r="${c.id}|accepted">Accept</button><button class="btn ${c.decision==="rejected"?"on":""}" data-r="${c.id}|rejected">Reject</button></div></div>`).join(""):`<div class="empty">No deck changes for this document.</div>`;
  $("#cf").onchange=e=>{S.cfilter=e.target.value;side()};
  bd.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const [id,dec]=b.dataset.r.split("|"),c=S.changes.find(x=>x.id===id);const nd=c.decision===dec?"":dec;await J("/api/review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,decision:nd})});c.decision=nd;side()});return}
 // metadata
 const q=d.quality||{},v=d.validation||{};const cnt={};d.pages.forEach(p=>cnt[p.source]=(cnt[p.source]||0)+1);
 const blocks=[];d.pages.forEach(p=>p.blocks.forEach(b=>{if(b.text||b.n_items)blocks.push({...b,page:p.n,c:b.source==="ocr"?b.conf:b.conf})}));
 const lim=S.filter==="all"?101:+S.filter;const shown=blocks.filter(b=>b.conf<lim);
 sb.innerHTML=`<select id="mf" style="min-width:0"><option value="all">Confidence: All</option><option value="98" ${S.filter==="98"?"selected":""}>Below 98%</option><option value="80" ${S.filter==="80"?"selected":""}>Below 80%</option></select><span style="color:var(--mute)">${shown.length+7} fields</span>`;
 const F=(l,val,c)=>`<div class="fld"><label>${l}${c!=null?badge(c):""}</label><div class="val ${c!=null&&c<80?"low":""}">${esc(val)||"&nbsp;"}</div></div>`;
 bd.innerHTML=`<div class="sec">Document</div>`+F("Title",d.title,null)+F("Language",d.lang,null)+F("Pages",`${d.pages.length}  (${Object.entries(cnt).map(([k,n])=>`${n} ${k}`).join(", ")})`,null)
  +F("Mean page confidence (heuristic)",Math.round((q.mean_page_confidence||0)*100)+"%",null)+F("XML validation",v.well_formed?(v.issues&&v.issues.length?v.issues.join("; "):"well-formed, no issues"):"failed",null)
  +F("Structure",`${v.headings||0} headings, ${v.tables||0} tables, ${v.figures||0} figures`,null)+F("Processing time",(d.seconds||"-")+" s",null)
  +`<div class="sec">Page diagnostics</div>`+d.pages.map(p=>`<div class="card"><div class="h"><b>Page ${p.n}</b><span>${esc(p.diag.health||"")} &rarr; ${esc(p.source)}</span>${badge((p.diag.confidence||0)*100)}</div><div style="color:var(--mute);font-size:12px">${esc((p.diag.reasons||[]).join("; ")||"native text layer looks healthy")}${p.diag.ocr?` &middot; OCR ${p.diag.ocr.conf}% (${esc(p.diag.ocr.langs)})`:""}</div></div>`).join("")
  +`<div class="sec">Content blocks</div>`+shown.slice(0,300).map(b=>F(`p${b.page} &middot; ${b.tag}${b.kind?" / "+esc(b.kind):""}`,b.text||`${b.n_items} items`,b.conf)).join("");
 $("#mf").onchange=e=>{S.filter=e.target.value;side()}}
function dash(){const s=S.sum;$("#dash").innerHTML=`<div class="grid">${[["Documents",s.documents],["Pages",s.pages],["OCR pages",s.ocr_pages],["Mean confidence*",Math.round((s.mean_confidence||0)*100)+"%"],["Wall time",(s.wall_seconds||0)+" s"]].map(k=>`<div class="kpi"><span style="color:var(--mute)">${k[0]}</span><b>${k[1]}</b></div>`).join("")}</div>
 <table><tr><th>Document<th>Pages<th>OCR<th>Lang<th>Seconds<th>Confidence*<th>Deck changes<th>Validation</tr>${s.docs.map(d=>`<tr class="c" data-id="${esc(d.id)}"><td>${esc(d.file)}<td>${d.pages}<td>${d.ocr_pages}<td>${esc(d.lang)}<td>${d.seconds}<td>${badge((d.conf||0)*100)}<td>${d.changes}<td>${d.ok?(d.issues.length?esc(d.issues.join("; ")):"OK"):"FAILED"}</tr>`).join("")}</table>
 <p style="color:var(--mute)">*Confidence values are heuristics, not measured accuracy.</p>`;
 $("#dash").querySelectorAll("tr.c").forEach(r=>r.onclick=()=>{nav("review");open(r.dataset.id)})}
function nav(v){$("#main").hidden=v!=="review";$("#dash").hidden=v!=="dash";$("#nv-review").classList.toggle("on",v==="review");$("#nv-dash").classList.toggle("on",v==="dash")}
$("#nv-review").onclick=()=>nav("review");$("#nv-dash").onclick=()=>nav("dash");
$("#docsel").onchange=e=>open(e.target.value);
$("#vtabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;S.vtab=t;document.querySelectorAll("#vtabs .tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));viewer()};
$("#stabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;S.stab=t;document.querySelectorAll("#stabs .tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));side()};
$("#rot").onclick=()=>{S.rot=(S.rot+90)%360;viewer()};
$("#dlxml").onclick=()=>{if(S.id)location.href=`/api/doc/${encodeURIComponent(S.id)}/xml?download=1`};
$("#reproc").onclick=async()=>{if(!S.id)return;const b=$("#reproc");b.textContent="Working...";b.disabled=true;try{await J(`/api/reprocess/${encodeURIComponent(S.id)}`,{method:"POST"});await open(S.id)}finally{b.textContent="Re-process";b.disabled=false}};
init().catch(e=>{$("#viewer").innerHTML=`<div class="empty">Could not load run data: ${esc(e.message)}</div>`});
</script></body></html>
